<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đăng kiểm xe tải</title>
<style>
:root{--p9:#2e1065;--p7:#6d28d9;--p6:#7c3aed;--p1:#ede9fe;--ok:#059669;--bad:#dc2626;--ln:#d9ccff}
*{box-sizing:border-box;margin:0}body{font:14px "Segoe UI",sans-serif;background:#faf8ff;color:#1e1038;display:flex;min-height:100vh}
aside{width:240px;background:linear-gradient(180deg,var(--p9),var(--p7));padding:24px 16px;flex-shrink:0}
aside h1{color:#fff;font-size:22px;margin-bottom:24px}
.app{display:block;width:100%;margin-bottom:10px;padding:12px;border:0;border-radius:8px;background:var(--p1);color:var(--p7);font:700 14px inherit;cursor:pointer}
.app.on{background:#fff;color:var(--p9)}
main{flex:1;padding:20px;min-width:0}h2{color:var(--p9);font-size:24px;margin-bottom:10px}
.tabs{display:flex;gap:4px;margin-bottom:12px}.tab{padding:9px 16px;border:1px solid var(--ln);border-radius:8px 8px 0 0;background:#fff;font:700 14px inherit;cursor:pointer}
.tab.on{background:var(--p6);color:#fff;border-color:var(--p6)}
.card{background:#fff;border:1px solid var(--ln);padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 10px}
label.f{font-weight:700;color:var(--p7);font-size:13px;display:block}
input,select{width:100%;padding:7px 9px;border:1px solid var(--ln);font:inherit;background:#fff}
button.b{padding:9px 18px;border:0;background:var(--p1);color:var(--p7);font:700 14px inherit;cursor:pointer;margin:10px 8px 0 0}
button.b.m{background:var(--p6);color:#fff}
table{width:100%;border-collapse:collapse;margin-top:8px}th{background:var(--p1);color:var(--p9);padding:8px;text-align:left}
td{padding:7px 8px;border-bottom:1px solid var(--p1)}tbody tr{cursor:pointer}tbody tr.sel{background:#ddd6fe}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.chk{display:flex;gap:8px;margin:6px 0}.chk input{width:auto}
#fee{background:var(--p9);color:#fff;padding:12px 16px;margin:12px 0;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}.st b{font-size:24px;color:var(--p7);display:block}
#toast{position:fixed;right:20px;bottom:20px;background:var(--p9);color:#fff;padding:12px 18px;display:none;max-width:420px}#toast.bad{background:var(--bad)}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}#modal.on{display:flex}
#mbox{background:#fff;padding:20px;width:560px;max-height:90vh;overflow:auto}#mbox h3{color:var(--p9);text-align:center}
#mbox table td,#mbox table th{border:1px solid var(--ln)}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none}.mbtn{display:none}}
@media(max-width:900px){body{flex-direction:column}aside{width:100%}.grid,.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<aside><h1>Đăng kiểm<br>xe tải</h1><button class="app on" data-k="TAI_NHE">Đề 3.3 · Xe tải nhẹ</button><button class="app" data-k="TAI_NANG">Đề 3.4 · Xe tải nặng</button></aside>
<main><h2 id="ttl"></h2>
<div class="tabs"><button class="tab on" data-t="lich">Đăng ký lịch hẹn</button><button class="tab" data-t="kiem">Xử lý đăng kiểm</button><button class="tab" data-t="tk">Thống kê &amp; lịch sử</button></div>
<section id="lich"><div class="card"><div class="grid">
<div><label class="f">Biển số *</label><input id="bs"></div><div><label class="f">Số khung (17 ký tự) *</label><input id="sk" maxlength="17"></div>
<div><label class="f">Chủ xe *</label><input id="cx"></div><div><label class="f">Số điện thoại *</label><input id="sd"></div>
<div><label class="f">Nhãn hiệu</label><input id="nh"></div><div><label class="f">Năm sản xuất *</label><input id="ns" type="number"></div>
<div><label class="f" id="l_tt"></label><input id="tt"></div><div><label class="f" id="l_tr"></label><input id="tr" type="number"></div>
<div><label class="f">Ngày hẹn (dd/MM/yyyy) *</label><input id="nd"></div><div><label class="f">Khung giờ *</label><select id="gio"></select></div></div>
<button class="b m" id="save">Lưu lịch hẹn</button><button class="b" id="clr">Làm mới</button><button class="b" id="huy">Hủy lịch</button><button class="b" id="xoa">Xóa</button></div>
<div class="card"><input id="q" placeholder="Tìm biển số / chủ xe..."><table><thead><tr><th>Mã</th><th>Biển số</th><th>Chủ xe</th><th>SĐT</th><th>Tải trọng (tấn)</th><th>Ngày hẹn</th><th>Giờ</th><th>Trạng thái</th></tr></thead><tbody id="tb"></tbody></table></div></section>
<section id="kiem" hidden><div class="card"><div class="grid" style="grid-template-columns:1fr 1fr"><div><label class="f">Chọn xe đang chờ kiểm</label><select id="pick"></select></div><div><label class="f">Đăng kiểm viên *</label><input id="dkv"></div></div>
<p style="margin:12px 0 4px;font-weight:700;color:var(--p7)">Bỏ tích hạng mục KHÔNG ĐẠT (mặc định là đạt):</p><div id="chk"></div><div id="fee"></div><button class="b m" id="done" style="margin:0">Hoàn tất &amp; lập phiếu</button></div></section>
<section id="tk" hidden><div class="stats" id="stats"></div><div class="card"><button class="b m" id="xem" style="margin-top:0">Xem / In phiếu</button><button class="b" id="csv" style="margin-top:0">Xuất CSV</button>
<table><thead><tr><th>Mã phiếu</th><th>Biển số</th><th>Ngày kiểm</th><th>Kết quả</th><th>Tổng phí</th><th>Hết hạn</th><th>Đăng kiểm viên</th></tr></thead><tbody id="hs"></tbody></table></div></section>
</main><div id="toast"></div><div id="modal"><div id="mbox"><div id="mbody"></div><button class="b m mbtn" onclick="print()">In phiếu</button><button class="b mbtn" onclick="modal.classList.remove('on')">Đóng</button></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>Number(n).toLocaleString('vi-VN')+' đ';
const F=['bs','sk','cx','sd','nh','ns','tt','tr','nd','gio'];
let ma='TAI_NHE',L,TC=[],editId=null,sel=null,hist=[],hsel=-1;
$('#gio').innerHTML='07:30,08:00,08:30,09:00,09:30,10:00,13:30,14:00,14:30,15:00,15:30,16:00'.split(',').map(g=>`<option>${g}</option>`).join('');
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3000)}
async function api(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)}:{});
 const j=await r.json();if(!r.ok)throw new Error(j.error||'Lỗi');return j}
const run=f=>f().catch(e=>toast(e.message,1));
const cls=s=>s=='Đạt'||s=='Hoàn thành'?'ok':s.startsWith('Không')||s=='Đã hủy'?'bad':'';
function today(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
const setApp=k=>run(async()=>{ma=k;$$('.app').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
 const r=await api('/api/loai/'+k);L=r.loai;TC=r.tieuChi;$('#ttl').textContent='Quản lý đăng kiểm '+L.ten.toLowerCase();
 $('#l_tt').textContent=`Tải trọng (${L.min}–${L.max} tấn) *`;$('#l_tr').textContent=`Số trục (${L.trucMin}–${L.trucMax}) *`;clr();tab('lich')});
function tab(t){$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==t));['lich','kiem','tk'].forEach(s=>$('#'+s).hidden=s!=t);
 run({lich:list,kiem:loadKiem,tk:loadTk}[t])}
function clr(){editId=sel=null;F.forEach(i=>$('#'+i).value='');$('#nd').value=today();$('#gio').selectedIndex=0;$$('#tb tr').forEach(r=>r.classList.remove('sel'))}
async function list(){const rows=await api('/api/lich/'+ma+'?q='+encodeURIComponent($('#q').value));
 $('#tb').innerHTML=rows.length?rows.map(r=>`<tr data-id="${r[0]}" data-st="${r[7]}"><td>${r[0]}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td class="${cls(r[7])}">${r[7]}</td></tr>`).join(''):'<tr><td colspan="8">Chưa có lịch hẹn.</td></tr>';
 $$('#tb tr[data-id]').forEach(tr=>tr.onclick=()=>run(async()=>{const o=await api('/api/lich/'+ma+'/chitiet?id='+tr.dataset.id);
  F.forEach((i,k)=>$('#'+i).value=o[k]==null?'':o[k]);sel={id:+tr.dataset.id,st:tr.dataset.st};editId=o[10]=='Chờ kiểm'?sel.id:null;
  $$('#tb tr').forEach(r=>r.classList.toggle('sel',r==tr))}))}
$('#q').oninput=()=>run(list);$('#clr').onclick=clr;
$('#save').onclick=()=>run(async()=>{const b={};F.forEach((i,k)=>b['f'+k]=$('#'+i).value);if(editId)b.id=editId;
 await api('/api/lich/'+ma+'/luu',b);toast(editId?'Đã cập nhật lịch hẹn':'Đã lưu lịch hẹn');clr();await list()});
const act=a=>()=>run(async()=>{if(!sel)throw new Error('Chọn một lịch hẹn trong bảng trước.');if(a=='xoa'&&!confirm('Xóa lịch hẹn này?'))return;
 await api('/api/lich/'+ma+'/'+a,{id:sel.id,st:sel.st});clr();await list()});
$('#huy').onclick=act('huy');$('#xoa').onclick=act('xoa');

async function loadKiem(){const c=await api('/api/cho/'+ma);
 $('#pick').innerHTML='<option value="">— Chọn xe —</option>'+c.map(x=>`<option value="${x.id}">${esc(x.text)}</option>`).join('');
 $('#chk').innerHTML=TC.map(t=>`<label class="chk"><input type="checkbox" checked> ${esc(t.ten)}</label>`).join('');$$('#chk input').forEach(i=>i.onchange=fee);fee()}
const allOk=()=>$$('#chk input').every(i=>i.checked);
function fee(){const ok=allOk(),h=new Date();h.setMonth(h.getMonth()+L.ky);
 $('#fee').innerHTML=`Phí kiểm định: <b>${money(L.phi)}</b> | Phí giấy chứng nhận (khi đạt): <b>${money(ok?L.giay:0)}</b><br>Tổng thanh toán: <b>${money(L.phi+(ok?L.giay:0))}</b> | Kết quả: <b>${ok?'Đạt, hiệu lực đến '+h.getDate()+'/'+(h.getMonth()+1)+'/'+h.getFullYear():'Không đạt, cần sửa và kiểm lại'}</b>`}
$('#done').onclick=()=>run(async()=>{const id=$('#pick').value;if(!id)throw new Error('Chọn xe cần kiểm định.');const ok=allOk();
 const r=await api('/api/kiem/'+ma,{lichId:id,dkv:$('#dkv').value,kq:$$('#chk input').map(i=>i.checked?1:0).join(',')});
 toast('Đã lập phiếu PK'+r.ma+': '+(ok?'ĐẠT':'KHÔNG ĐẠT')+'. Xem và in phiếu ở tab Thống kê.');$('#dkv').value='';await loadKiem()});

async function loadTk(){const r=await api('/api/tk/'+ma),s=r.stats;hist=r.phieu;hsel=-1;
 $('#stats').innerHTML=[['Chờ kiểm',s.cho],['Đạt',s.dat],['Không đạt',s.khongDat],['Doanh thu phí',money(s.doanhThu)],['Sắp hết hạn (30 ngày)',s.sapHan]].map(a=>`<div class="card st"><b>${a[1]}</b>${a[0]}</div>`).join('');
 $('#hs').innerHTML=hist.length?hist.map((p,i)=>`<tr data-i="${i}"><td>PK${p.ma}</td><td><b>${esc(p.bs)}</b></td><td>${p.ngay}</td><td class="${cls(p.kq)}">${p.kq}</td><td>${money(p.phi)}</td><td>${p.het}</td><td>${esc(p.dkv)}</td></tr>`).join(''):'<tr><td colspan="7">Chưa có phiếu kiểm định.</td></tr>';
 $$('#hs tr[data-i]').forEach(tr=>{tr.onclick=()=>{hsel=+tr.dataset.i;$$('#hs tr').forEach(r=>r.classList.toggle('sel',r==tr))};tr.ondblclick=()=>run(()=>show(+tr.dataset.i))})}
$('#xem').onclick=()=>run(async()=>{if(hsel<0)throw new Error('Chọn một phiếu trong bảng trước.');await show(hsel)});
async function show(i){const p=hist[i],ct=await api('/api/phieu/'+ma+'?id='+p.ma),ok=p.kq=='Đạt';
 $('#mbody').innerHTML=`<h3>${ok?'GIẤY CHỨNG NHẬN KIỂM ĐỊNH':'THÔNG BÁO KẾT QUẢ KHÔNG ĐẠT'}</h3><p style="text-align:center">Số phiếu: <b>PK${p.ma}</b> · ${esc(L.ten)}</p><hr>
 <p style="line-height:1.7">Biển số: <b>${esc(p.bs)}</b><br>Chủ xe: ${esc(p.cx)} (${esc(p.sd)})<br>Ngày kiểm: ${p.ngay}<br>Đăng kiểm viên: ${esc(p.dkv)}<br>${ok?'Có hiệu lực đến: <b>'+p.het+'</b>':'Cần sửa chữa các hạng mục chưa đạt rồi đăng ký kiểm lại'}</p>
 <table><tr><th>Hạng mục</th><th>Kết quả</th></tr>${ct.map(r=>`<tr><td>${esc(r[0])}</td><td class="${r[1]?'ok':'bad'}">${r[1]?'Đạt':'Không đạt'}</td></tr>`).join('')}</table><p>Tổng phí: <b>${money(p.phi)}</b></p>`;
 $('#modal').classList.add('on')}
$('#csv').onclick=()=>{const rows=[['Mã phiếu','Biển số','Chủ xe','SĐT','Ngày kiểm','Kết quả','Tổng phí','Hết hạn','Đăng kiểm viên'],...hist.map(p=>['PK'+p.ma,p.bs,p.cx,p.sd,p.ngay,p.kq,p.phi,p.het,p.dkv])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='LichSu_'+ma+'.csv';a.click()};
$$('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.t));$$('.app').forEach(b=>b.onclick=()=>setApp(b.dataset.k));
setApp('TAI_NHE');
</script></body></html>
