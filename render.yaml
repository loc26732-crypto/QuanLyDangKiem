services:
  - type: web
    name: quan-ly-dang-kiem
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false   # dán chuỗi kết nối PostgreSQL (Neon) vào đây khi Render hỏi
